name: Deploy storefront

# Replaces Amplify's build-on-push. Run scripts/github-oidc.sh once, then set
# the AWS_DEPLOY_ROLE repository variable to the role ARN it prints.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-storefront
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check the CloudFront router still matches the routing contract
        run: node scripts/cloudfront-function.test.mjs

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: us-east-1

      - run: ./scripts/deploy.sh
        env:
          NEXT_PUBLIC_API_URL: https://api.atozaccessory.com
          NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID || '1617903932237399' }}
          NEXT_PUBLIC_SITE_URL: https://www.atozaccessory.com
